document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

etter-spacing:.02em\">Autel dijagnostika<\u002Fdiv><div style=\"margin-top:6px;font-size:16px;line-height:1.55;color:#CFCFCF\">Brzo nalazimo kvar u elektro-sistemu vozila.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:flex-start;padding:24px;background:#1F1F1F;border-radius:28px\">\n      <img src=\"42a82a1e-8ad7-4182-874f-981ce67ee678\" alt=\"\" width=\"44\" height=\"44\">\n      <div><div style=\"font-family:Manrope,sans-serif;font-size:20px;font-weight:600;letter-spacing:.02em\">Exide AGM akumulatori<\u002Fdiv><div style=\"margin-top:6px;font-size:16px;line-height:1.55;color:#CFCFCF\">Uvoznik Smitran Auto. Prodaja i ugradnja na licu mesta.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:flex-start;padding:24px;background:#1F1F1F;border-radius:28px\">\n      <img src=\"4a59a7dc-9a6f-4457-ac74-103322605ee6\" alt=\"\" width=\"44\" height=\"44\">\n      <div><div style=\"font-family:Manrope,sans-serif;font-size:20px;font-weight:600;letter-spacing:.02em\">Hotel pod video nadzorom<\u002Fdiv><div style=\"margin-top:6px;font-size:16px;line-height:1.55;color:#CFCFCF\">Gume preuzimate kad vam odgovara, uvek dostupne na uvid.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- USLUGE -->\n<section id=\"usluge\" data-screen-label=\"02 Usluge\" style=\"scroll-margin-top:72px;background:#FFFFFF\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(16px,4vw,48px)\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:48px\">\n      <h2 style=\"margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:{{ fs40_5p4_76 }};line-height:1;color:#212121;letter-spacing:-.03em\">Šta radimo<\u002Fh2>\n      <p style=\"margin:0;max-width:440px;font-size:16px;line-height:1.6;color:#3A3A3A\">Vulkanizer Beograd i autoelektrika u istoj radionici — od zamene guma do provere alternatora.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ svcCols }};gap:12px\">\n      <a href=\"#kalkulator\" sc-camel-on-click=\"{{ goGume }}\" style=\"grid-column:{{ featCol }};grid-row:{{ featRow }};position:relative;overflow:hidden;display:flex;flex-direction:column;gap:24px;padding:clamp(28px,3vw,40px);min-height:560px;border-radius:32px;background:#1F1F1F;color:#FFFFFF\" style-hover=\"background:#262626;color:#FFFFFF\">\n        <img src=\"cc1d99f6-cd34-45c9-9168-d64d17e6e2ce\" alt=\"\" style=\"position:absolute;right:-22%;bottom:-24%;width:78%;max-width:420px;pointer-events:none\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;position:relative\">\n          <span style=\"width:56px;height:56px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\"><img src=\"ec342071-658d-48bf-9925-612b0459d5dd\" alt=\"\" width=\"32\" height=\"32\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:.12em;color:#BDBDBD\">01<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;position:relative;max-width:420px\">\n          <h3 style=\"margin:0;font-family:Manrope,sans-serif;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em\">Vulkanizer<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#CFCFCF;text-wrap:pretty\">Zamena guma na novim Corghi mašinama, uz zaštitu aluminijumskih felni i kalibrisano balansiranje.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;position:relative\"><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#FFFFFF\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#F34F4C;margin-top:8px\"><\u002Fspan>Zamena guma sa balansiranjem<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#FFFFFF\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#F34F4C;margin-top:8px\"><\u002Fspan>Krpljenje i vulkaniziranje<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#FFFFFF\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#F34F4C;margin-top:8px\"><\u002Fspan>Pumpanje guma azotom<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#FFFFFF\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#F34F4C;margin-top:8px\"><\u002Fspan>Zamena tubeless ventila<\u002Fli><\u002Ful>\n        <div style=\"margin-top:auto;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:16px\">\n          <div><div style=\"font-size:12px;letter-spacing:.12em;font-weight:700;color:#BDBDBD\">KOMPLET OD<\u002Fdiv><div style=\"font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:4px\">840 din <span style=\"font-size:16px;font-weight:500;color:#BDBDBD\">/ točak<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <span style=\"display:flex;align-items:center;gap:12px;background:#D3413F;color:#FFFFFF;padding:16px 28px;border-radius:999px;font-weight:700;font-size:16px\">Izračunaj cenu →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#hotel\" style=\"display:flex;flex-direction:column;gap:20px;padding:28px;border-radius:32px;background:#F4F4F4;color:#212121\" style-hover=\"background:#ECECEC;color:#212121\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"width:56px;height:56px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\"><img src=\"c4f7e662-c4ed-4cdf-b475-14ef19b9e934\" alt=\"\" width=\"32\" height=\"32\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:.12em;color:#5A5A5A\">02<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <h3 style=\"margin:0;font-family:Manrope,sans-serif;font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em\">Hotel za gume<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.55;color:#3A3A3A;text-wrap:pretty\">Vansezonske gume čuvamo pravilno odložene, da ih ne nosite od kuće i nazad.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px\"><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#212121\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D3413F;margin-top:8px\"><\u002Fspan>4 gume, 6 meseci<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#212121\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D3413F;margin-top:8px\"><\u002Fspan>Sa felnama ili bez<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#212121\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D3413F;margin-top:8px\"><\u002Fspan>Video nadzor, preuzimanje bilo kada<\u002Fli><\u002Ful>\n        <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid #DEDEDE;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <div><div style=\"font-size:20px;font-weight:800;letter-spacing:-.01em\">od 3.000 din<\u002Fdiv><div style=\"font-size:12px;color:#5A5A5A;margin-top:2px\">po sezoni<\u002Fdiv><\u002Fdiv>\n          <span style=\"width:48px;height:48px;border-radius:50%;background:#1F1F1F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:20px\">→<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#kalkulator\" sc-camel-on-click=\"{{ goElektro }}\" style=\"display:flex;flex-direction:column;gap:20px;padding:28px;border-radius:32px;background:#F4F4F4;color:#212121\" style-hover=\"background:#ECECEC;color:#212121\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"width:56px;height:56px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\"><img src=\"37e082c0-648e-4e2e-a081-821118515a3e\" alt=\"\" width=\"32\" height=\"32\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:.12em;color:#5A5A5A\">03<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <h3 style=\"margin:0;font-family:Manrope,sans-serif;font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em\">Autoelektrika<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.55;color:#3A3A3A;text-wrap:pretty\">Nalazimo uzrok kvara u elektro-sistemu i rešavamo ga, ili kažemo šta je sledeći korak.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px\"><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#212121\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D3413F;margin-top:8px\"><\u002Fspan>Dijagnostika elektronskih sistema<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#212121\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D3413F;margin-top:8px\"><\u002Fspan>Svetla, migavci, podizači prozora<\u002Fli><li style=\"display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:#212121\"><span style=\"flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D3413F;margin-top:8px\"><\u002Fspan>Alternator i priprema za tehnički<\u002Fli><\u002Ful>\n        <div style=\"margin-top:auto;paddin :column;gap:2px\">\n                        <span style=\"font-size:16px;font-weight:600;line-height:1.35\">{{ s.label }}<\u002Fspan>\n                        <span style=\"font-size:12px;color:#5A5A5A\">{{ s.sub }}<\u002Fspan>\n                      <\u002Fspan>\n                      <div style=\"display:flex;align-items:center;border:1.5px solid #D6D6D6;border-radius:999px;overflow:hidden\">\n                        <button sc-camel-on-click=\"{{ s.dec }}\" aria-label=\"Manje\" style=\"width:44px;height:44px;border:none;background:#F4F4F4;font-size:20px;cursor:pointer;color:#212121\">−<\u002Fbutton>\n                        <span style=\"width:48px;text-align:center;font-family:Manrope,sans-serif;font-size:20px;font-weight:600\">{{ s.qty }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ s.inc }}\" aria-label=\"Više\" style=\"width:44px;height:44px;border:none;background:#F4F4F4;font-size:20px;cursor:pointer;color:#212121\">+<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ b.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:0;padding:14px 18px;background:#F4F4F4;border-radius:20px;font-size:12px;line-height:1.55;color:#3A3A3A\">{{ b.note }}<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ b.hasAction }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ b.action }}\" style=\"align-self:flex-start;display:flex;gap:10px;align-items:center;padding:12px 16px;border:1.5px dashed #D3413F;background:#FFFFFF;color:#D3413F;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer\">+ {{ b.actionLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- right: receipt -->\n      <aside style=\"flex:1 1 340px;max-width:{{ receiptMax }};position:sticky;top:96px\">\n        <div style=\"background:#FFFFFF;border-radius:32px 32px 0 0;overflow:hidden;box-shadow:0 1px 0 #E2E2E2,0 18px 40px -24px rgba(31,31,31,.35)\">\n          <div style=\"background:#1F1F1F;color:#FFFFFF;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n            <div style=\"display:flex;align-items:center;gap:10px\"><img src=\"caf47c6a-1495-49f8-96a2-7c4ffac1bed8\" alt=\"\" width=\"26\" height=\"26\"><span style=\"font-family:Manrope,sans-serif;font-size:20px;font-weight:600;letter-spacing:.06em\">PREDRAČUN<\u002Fspan><\u002Fdiv>\n            <span style=\"font-family:Manrope,sans-serif;font-size:16px;color:#BDBDBD;letter-spacing:.04em\">{{ today }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:6px 24px 0\">\n            <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;padding:36px 0;text-align:center;font-size:16px;line-height:1.6;color:#5A5A5A\">Izaberite usluge levo —<br>cena se računa odmah.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n              <div style=\"padding:18px 0 14px;border-bottom:1.5px dashed #D6D6D6\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;margin-bottom:10px\">\n                  <span style=\"font-family:Manrope,sans-serif;font-size:12px;letter-spacing:.12em;color:#D3413F;text-transform:uppercase\">{{ g.title }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#5A5A5A\">{{ g.sub }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ g.lines }}\" as=\"l\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;justify-content:space-between;gap:14px;padding:6px 0\">\n                    <div style=\"min-width:0\">\n                      <div style=\"font-size:16px;font-weight:600;line-height:1.35\">{{ l.label }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#5A5A5A;margin-top:2px\">{{ l.meta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-family:Manrope,sans-serif;font-size:16px;font-weight:500;white-space:nowrap\">{{ l.total }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"padding:20px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px\">\n              <div>\n                <div style=\"font-family:Manrope,sans-serif;font-size:12px;letter-spacing:.12em;color:#212121\">UKUPNO OKVIRNO<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5A5A5A;margin-top:4px\">{{ totalNote }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:Manrope,sans-serif;font-weight:700;font-size:44px;line-height:1;color:#D3413F;white-space:nowrap\">{{ total }}<span style=\"font-size:20px;font-weight:500;margin-left:6px;color:#212121\">din<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:16px 0 24px\">\n              <a href=\"tel:+381628945306\" style=\"display:flex;justify-content:center;align-items:center;gap:10px;background:#D3413F;color:#FFFFFF;padding:16px;border-radius:999px;font-weight:700;font-size:16px\" style-hover=\"background:#F34F4C;color:#FFFFFF\">Pozovi i zakaži · 062/894-53-06<\u002Fa>\n              <div style=\"display:flex;gap:8px\">\n                <a href=\"{{ mailto }}\" style=\"flex:1;display:flex;justify-content:center;align-items:center;border:1.5px solid #212121;color:#212121;padding:13px;border-radius:999px;font-weight:700;font-size:16px\" style-hover=\"background:#212121;color:#FFFFFF\">Pošalji upit mejlom<\u002Fa>\n                <button sc-camel-on-click=\"{{ reset }}\" style=\"padding:13px 16px;border:1.5px solid #D6D6D6;background:#FFFFFF;border-radius:999px;font-weight:600;font-size:16px;color:#3A3A3A;cursor:pointer\">Poništi<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:12px;background-image:radial-gradient(circle at 8px 12px,#F4F4F4 6px,transparent 6.5px);background-size:16px 12px;background-color:#FFFFFF\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:16px 4px 0;font-size:12px;line-height:1.6;color:#5A5A5A\">Cene po cenovniku od 16.03.2026, Beograd. PDV je uračunat u cenu. Predračun je okviran — konačnu cenu potvrđujemo u radionici.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOTEL -->\n<section id=\"hotel\" data-screen-label=\"05 Hotel za gume\" style=\"scroll-margin-top:72px;background:#F4F4F4;padding:0 clamp(16px,4vw,48px) clamp(64px,8vw,112px)\">\n  <div style=\"max-width:1224px;margin:0 auto;background:#1F1F1F;color:#FFFFFF;border-radius:40px;padding:clamp(40px,6vw,88px) clamp(24px,5vw,72px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n      <div style=\"flex:1 1 400px;display:flex;flex-direction:column;gap:22px\">\n        <div style=\"font-family:Manrope,sans-serif;font-size:16px;letter-spacing:.14em;color:#F34F4C\">HOTEL ZA GUME BEOGRAD<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:{{ fs40_5_72 }};line-height:1;letter-spacing:-.03em\">Gume ostaju<br>kod nas.<br><span style=\"color:#F34F4C\">Vi ne nosite ništa.<\u002Fspan><\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#CFCFCF;max-width:460px;text-wrap:pretty\">Praktično rešenje ako nemate mesta za vansezonske gume ili ne želite svaki put da ih nosite od kuće do vulkanizera i nazad.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:6px\">\n          <div style=\"border:1px solid #3A3A3A;padding:16px 22px;min-width:180px;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:32px;font-weight:600\">3.000 <span style=\"font-size:16px;color:#BDBDBD\">din<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#BDBDBD;margin-top:4px\">4 gume · 6 meseci<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #3A3A3A;padding:16px 22px;min-width:180px;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:32px;font-weight:600\">3.600 <span style=\"font-size:16px;color:#BDBDBD\">din<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#BDBDBD;margin-top:4px\">4 gume sa felnama · 6 meseci<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"#kalkulator\" sc-camel-on-click=\"{{ goHotel }}\" style=\"align-self:flex-start;display:flex;gap:12px;align-items:center;background:#D3413F;color:#FFFFFF;padding:16px 22px;border-radius:999px;font-weight:700;font-size:16px;margin-top:6px\" style-hover=\"background:#F34F4C;color:#FFFFFF\">Dodaj u predračun →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 520px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;align-self:flex-start\">\n        <div style=\"background:#2A2A2A;padding:24px;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:12px;color:#F34F4C;letter-spacing:.1em\">01 · POLOŽAJ<\u002Fdiv><p style=\"margin:10px 0 0;font-size:16px;line-height:1.6;color:#E0E0E0\">Gume bez felni stoje uspravno, malo razmaknute. Jednom mesečno ih okrenemo za 1/8 kruga da se gazni sloj ne zaravna. Sa felnama — jedna preko druge ili okačene.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#2A2A2A;padding:24px;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:12px;color:#F34F4C;letter-spacing:.1em\">02 · TEMPERATURA<\u002Fdiv><p style=\"margin:10px 0 0;font-size:16px;line-height:1.6;color:#E0E0E0\">Ujednačenih 15–20 °C — najviše odgovara gumama van upotrebe.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#2A2A2A;padding:24px;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:12px;color:#F34F4C;letter-spacing:.1em\">03 · BEZ SUNCA I VLAGE<\u002Fdiv><p style=\"margin:10px 0 0;font-size:16px;line-height:1.6;color:#E0E0E0\">Sunce isušuje gumu, a kondenzacija je postepeno kvari. Kod nas nema ni kiše, snega ni mraza.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#2A2A2A;padding:24px;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:12px;color:#F34F4C;letter-spacing:.1em\">04 · BEZ HEMIKALIJA<\u002Fdiv><p style=\"margin:10px 0 0;font-size:16px;line-height:1.6;color:#E0E0E0\">Daleko od ulja, benzina, nafte, rastvarača i oštrih predmeta.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#333333;padding:24px;grid-column:1/-1;border-radius:24px\"><div style=\"font-family:Manrope,sans-serif;font-size:12px;color:#F34F4C;letter-spacing:.1em\">PRE SKLADIŠTENJA<\u002Fdiv><p style=\"margin:10px 0 0;font-size:16px;line-height:1.6;color:#E0E0E0\">Obeležavamo pozicije i proveravamo dubinu šare, datum proizvodnje (DOT) i stanje gume — ispucalost, lamele, način trošenja. Gume evidentiramo i izdajemo revers. Možete ih preuzeti bilo kada; objekat je pod video nadzorom.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TPMS + AKUMULATORI -->\n<section id=\"tpms\" data-screen-label=\"06 TPMS i akumulatori\" style=\"scroll-margin-top:72px;background:#FFFFFF\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(16px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px\">\n    <div style=\"background:#F4F4F4;border-radius:32px;padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:18px\">\n      <img src=\"7e3a7022-f14d-4c7c-834d-b29fc4dce682\" alt=\"\" width=\"52\" height=\"52\">\n      <h2 style=\"margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:{{ fs32_3p6_48 }};line-height:1;letter-spacing:-.03em\">TPMS senzori<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#3A3A3A\">Senzori mere pritisak u gumama u realnom vremenu i upozoravaju vozača na instrument tabli kad pritisak padne.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;border-top:1px solid #D6D6D6\">\n        <div style=\"padding:14px 0;border-bottom:1px solid #D6D6D6;display:grid;grid-template-columns:130px 1fr;gap:12px\"><span style=\"font-family:Manrope,sans-serif;font-weight:600;text-transform:uppercase;font-size:16px\">Kloniranje<\u002Fspan><span style=\"font-size:16px;line-height:1.55;color:#3A3A3A\">Prepisujemo podatke sa starog senzora na novi, da bude kompatibilan sa vozilom.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:14px 0;border-bottom:1px solid #D6D6D6;display:grid;grid-template-columns:130px 1fr;gap:12px\"><span style=\"font-family:Manrope,sans-serif;font-weight:600;text-transform:uppercase;font-size:16px\">Programiranje<\u002Fspan><span style=\"font-size:16px;line-height:1.55;color:#3A3A3A\">Specijalnim alatom, da se podaci ispravno prikazuju na tabli.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:14px 0;border-bottom:1px solid #D6D6D6;display:grid;grid-template-columns:130px 1fr;gap:12px\"><span style=\"font-family:Manrope,sans-serif;font-weight:600;text-transform:uppercase;font-size:16px\">Autel MX<\u002Fspan><span style=\"font-size:16px;line-height:1.55;color:#3A3A3A\">Kompatibilni sa većinom savremenih vozila, garancija najmanje 2 godine.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:auto\">\n        <span style=\"font-family:Manrope,sans-serif;font-size:28px;font-weight:600\">6.000 din <span style=\"font-size:16px;font-weight:400;color:#5A5A5A\">/ senzor sa kodiranjem<\u002Fspan><\u002Fspan>\n        <a href=\"#kalkulator\" sc-camel-on-click=\"{{ goGume }}\" style=\"font-weight:700;font-size:16px\">Izračunaj sa ugradnjom →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F4F4F4;border-radius:32px;padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:18px\">\n      <img src=\"42a82a1e-8ad7-4182-874f-981ce67ee678\" alt=\"\" width=\"52\" height=\"52\">\n      <h2 style=\"margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:{{ fs32_3p6_48 }};line-height:1;letter-spacing:-.03em\">Akumulatori Exide<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#3A3A3A\">Akumulatori uvoznika Smitran Auto, trenutno Exide AGM. Po dogovoru poručujemo i model koji nemamo na stanju, i odmah ga ugrađujemo.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"background:#FFFFFF;padding:18px 24px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"><div><div style=\"font-family:Manrope,sans-serif;font-size:20px;font-weight:600\">Exide AGM 12V 72Ah 760A D+<\u002Fdiv><div style=\"font-size:12px;color:#5A5A5A;margin-top:2px\">36 meseci garancije<\u002Fdiv><\u002Fdiv><span style=\"font-family:Manrope,sans-serif;font-size:24px;font-weight:600;color:#D3413F\">16.490 din<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:18px 24px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"><div><div style=\"font-family:Manrope,sans-serif;font-size:20px;font-weight:600\">Exide AGM 12V 62Ah 680A D+<\u002Fdiv><div style=\"font-size:12px;color:#5A5A5A;margin-top:2px\">36 meseci garancije<\u002Fdiv><\u002Fdiv><span style=\"font-family:Manrope,sans-serif;font-size:24px;font-weight:600;color:#D3413F\">14.990 din<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:12px;color:#5A5A5A\">Cenu i raspoloživost potvrdite telefonom pre dolaska.<\u002Fp>\n      <a href=\"#kalkulator\" sc-camel-on-click=\"{{ goAku }}\" style=\"margin-top:auto;font-weight:700;font-size:16px\">Dijagnostika, dopuna i formiranje — cene →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" data-screen-label=\"07 FAQ\" style=\"scroll-margin-top:72px;background:#F4F4F4\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(16px,4vw,48px);display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,80px)\">\n    <div style=\"flex:1 1 300px\">\n      <h2 style=\"margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:{{ fs40_5p4_76 }};line-height:1;letter-spacing:-.03em\">Česta<br>pitanja<\u002Fh2>\n      <p style=\"margin:20px 0 0;font-size:16px;line-height:1.6;color:#3A3A3A;max-width:320px\">Niste našli odgovor? <a href=\"tel:+381628945306\">Pozovite nas<\u002Fa> — objasnićemo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:2 1 560px;border-top:2px solid #212121\">\n      <div style=\"border-bottom:1px solid #D6D6D6\">\n        <button sc-camel-on-click=\"{{ faq0 }}\" aria-expanded=\"{{ f0 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border:none;background:transparent;cursor:pointer;text-align:left;color:#212121\"><span style=\"font-family:Manrope,sans-serif;font-size:{{ fs20_1p8_24 }};font-weight:500\">Šta kad se upali lampica za pritisak u gumama, a šta kad treperi?<\u002Fspan><span style=\"flex:0 0 36px;height:36px;border-radius:50%;background:{{ fb0 }};color:{{ fc0 }};display:flex;align-items:center;justify-content:center;font-size:20px\">{{ fs0 }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f0 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 {{ faqPad }} 24px 0;font-size:16px;line-height:1.7;color:#3A3A3A\">Proverite pritisak i da li ima oštećenja na gumi. Ako je sve u redu, svratite da očitamo senzor i damo savet. Ako nemate direktne senzore (indirektni TPMS), treba naduvati gume i resetovati TPMS — ako ne znate kako, pozovite nas. Ako lampica treperi, najčešće je u pitanju senzor ili risiver koji prenosi informaciju do računara.<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #D6D6D6\">\n        <button sc-camel-on-click=\"{{ faq1 }}\" aria-expanded=\"{{ f1 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border:none;background:transparent;cursor:pointer;text-align:left;color:#212121\"><span style=\"font-family:Manrope,sans-serif;font-size:{{ fs20_1p8_24 }};font-weight:500\">Da li može da se menja baterija na senzoru?<\u002Fspan><span style=\"flex:0 0 36px;height:36px;border-radius:50%;background:{{ fb1 }};color:{{ fc1 }};display:flex;align-items:center;justify-content:center;font-size:20px\">{{ fs1 }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f1 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 {{ faqPad }} 24px 0;font-size:16px;line-height:1.7;color:#3A3A3A\">To ne radimo, jer je baterija fabrički zalivena. Točak se okreće velikom brzinom i trpi velike promene temperature. Dostupni materijali i „domaća radinost“ (npr. silikon) nemaju garanciju da će uspeti, a često izađu skuplje od novog senzora.<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #D6D6D6\">\n        <button sc-camel-on-click=\"{{ faq2 }}\" aria-expanded=\"{{ f2 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border:none;background:transparent;cursor:pointer;text-align:left;color:#212121\"><span style=\"font-family:Manrope,sans-serif;font-size:{{ fs20_1p8_24 }};font-weight:500\">Koje senzore da kupim?<\u002Fspan><span style=\"flex:0 0 36px;height:36px;border-radius:50%;background:{{ fb2 }};color:{{ fc2 }};display:flex;align-items:center;justify-content:center;font-size:20px\">{{ fs2 }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f2 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 {{ faqPad }} 24px 0;font-size:16px;line-height:1.7;colo  auto;padding:20px clamp(16px,4vw,48px) {{ footPad }};border-top:1px solid #333;font-size:12px;color:#9A9A9A;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;text-align:center\">\n    <span>© 2026 Kom-Auto<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter><\u002Fdiv>\n\n<!-- MOBILE STICKY CALL -->\n<sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;background:#1F1F1F;padding:8px 8px 8px 24px;border-radius:999px;display:flex;gap:10px;align-items:center;box-shadow:0 -8px 24px rgba(0,0,0,.2)\">\n    <a href=\"#kalkulator\" style=\"flex:1;display:flex;flex-direction:column;color:#FFFFFF;padding-left:6px\">\n      <span style=\"font-size:12px;letter-spacing:.1em;color:#BDBDBD;font-family:Manrope,sans-serif\">PREDRAČUN<\u002Fspan>\n      <span style=\"font-family:Manrope,sans-serif;font-size:20px;font-weight:600\">{{ total }} din<\u002Fspan>\n    <\u002Fa>\n    <a href=\"tel:+381628945306\" style=\"display:flex;align-items:center;justify-content:center;height:52px;padding:0 22px;background:#D3413F;color:#FFFFFF;border-radius:999px;font-weight:700;font-size:16px\">Pozovi<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SIZES = {\n  putnicko: ['10\"–14\"', '15\"', '16\"–17\"', '18\"–19\"', '20\"–22\"', '23\"–26\"'],\n  suv: ['15\"–17\"', '18\"–19\"', '20\"–26\"'],\n  kombi: ['C 14\"–17\"'],\n  pikap: ['14\"–17\"']\n};\nconst INCH = { putnicko: [12, 15, 16.5, 18.5, 21, 24.5], suv: [16, 18.5, 23], kombi: [15.5], pikap: [15.5] };\nconst PR = {\n  putnicko: { komplet: [840, 960, 1200, 1560, 2160, 2400], sezonska: [420, 480, 540, 540, 600, 600], rft: [null, 1680, 1920, 2160, 2520, 3000], skid: [180, 240, 360, 360, 480, 480], demont: [240, 240, 360, 420, 480, 600], balans: [660, 720, 840, 1140, 1680, 1920], krpLabel: 'Hladno krpljenje spoljne gume' },\n  suv: { komplet: [1380, 1680, 2400], sezonska: [540, 660, 780], rft: [1920, 2160, 2760], skid: [360, 480, 540], demont: [360, 540, 720], balans: [900, 1140, 1680], krpLabel: 'Vulkaniziranje spoljne gume' },\n  kombi: { komplet: [1440], sezonska: [720], rft: null, skid: [360], demont: [360], balans: [1080], krpLabel: 'Vulkaniziranje spoljne gume' },\n  pikap: { komplet: [1200], sezonska: [600], rft: null, skid: [360], demont: [360], balans: [1080], krpLabel: 'Vulkaniziranje spoljne gume' }\n};\nconst VEH = [\n  { id: 'putnicko', label: 'Putničko', sub: '10\"–26\"' },\n  { id: 'suv', label: 'SUV', sub: '15\"–26\"' },\n  { id: 'kombi', label: 'Kombi', sub: 'C 14\"–17\"' },\n  { id: 'pikap', label: 'Pikap', sub: '14\"–17\"' }\n];\nconst AH = ['do 60Ah', '60–100Ah', 'preko 100Ah'];\nconst DOPUNA = [600, 750, 1050], FORM = [800, 1050, 1400];\nconst VENTIL = 120, SENZOR = 600, KRP = 480, TPMS = 6000, HOUR = 4000;\nconst fmt = n => String(Math.round(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\nconst VSTEPS = [\n  { title: 'Čišćenje felne', text: 'Čeličnom četkom skidamo rđu i ostatke gume.', left: '47.7%', top: '47.6%' },\n  { title: 'Provera ventila', text: 'Ako ima pukotina, menjamo ga odmah.', left: '44.5%', top: '64.7%' },\n  { title: 'Balansiranje', text: 'Preko 60 g tegova? Okrećemo gumu na felni.', left: '66.4%', top: '64.5%' },\n  { title: 'Corghi mašine', text: 'Zaštitni delovi čuvaju aluminijumske felne.', left: '66.9%', top: '43.7%' }\n];\nconst VDUR = 3600;\nconst INIT = { tab: 'gume', veh: 'putnicko', size: 2, wheels: 4, pkg: 'komplet', ex: {}, krp: 0, tpms: 0, aDiag: false, aInst: false, ah: 1, charge: 'none', bat: 'none', aMont: false, hotel: 'none', hours: 0 };\n\nclass Component extends DCLogic {\n  state = { ...INIT, ex: {}, w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false, scrolled: false, faq: -1, vStep: 0, carIn: false, ime: '', tel: '', poruka: '', formErr: false };\n\n  componentDidMount() {\n    this._r = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this._r);\n    this._s = () => { const sc = window.scrollY > 40; if (sc !== this.state.scrolled) this.setState({ scrolled: sc }); };\n    window.addEventListener('scroll', this._s, { passive: true });\n    this._carRef = this._carRef || React.createRef();\n    if (window.IntersectionObserver) {\n      this._io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !this.state.carIn) this.setState({ carIn: true }); }), { threshold: 0.3 });\n      setTimeout(() => { if (this._carRef.current) this._io.observe(this._carRef.current); }, 0);\n    } else this.setState({ carIn: true });\n    this._vt = setInterval(() => { if (this.state.carIn && Date.now() > (this._vPause || 0)) this.setState(x => ({ vStep: (x.vStep + 1) % VSTEPS.length })); }, VDUR);\n    this._s();\n    this._r();\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._r); window.removeEventListener('scroll', this._s); clearInterval(this._vt); if (this._io) this._io.disconnect(); }\n\n  pickVeh(id) {\n    this.setState(s => {\n      const target = INCH[s.veh][s.size] || 16;\n      let best = 0, d = 1e9;\n      INCH[id].forEach((v, i) => { const dd = Math.abs(v - target); if (dd < d) { d = dd; best = i; } });\n      const p = PR[id];\n      const pkg = s.pkg === 'rft' && !(p.rft && p.rft[best]) ? 'komplet' : s.pkg;\n      return { veh: id, size: best, pkg };\n    });\n  }\n  pickSize(i) {\n    this.setState(s => {\n      const p = PR[s.veh];\n      return { size: i, pkg: s.pkg === 'rft' && !(p.rft && p.rft[i]) ? 'komplet' : s.pkg };\n    });\n  }\n  pickPkg(k) {\n    this.setState(s => ({ pkg: k, tpms: (k === 'komplet' || k === 'rft') ? s.tpms : 0 }));\n  }\n  toggleEx(k) { this.setState(s => ({ ex: { ...s.ex, [k]: !s.ex[k] } })); }\n  setTab(t) { this.setState({ tab: t, menu: false }); }\n\n  chip(on) { return on ? { bg: '#1F1F1F', fg: '#FFFFFF', bd: '#1F1F1F' } : { bg: '#FFFFFF', fg: '#212121', bd: '#DEDEDE' }; }\n  row({ label, sub, price, on, pick, disabled, radio, tag }) {\n    return {\n      label, sub: sub || '', hasSub: !!sub, price: price || '', on: !!on, tag: tag || '', hasTag: !!tag,\n      pick: disabled ? undefined : pick,\n      bg: on ? '#FFF6F5' : '#FFFFFF', bd: on ? '#D3413F' : '#E2E2E2',\n      checkBg: on ? '#D3413F' : '#FFFFFF', checkBd: on ? '#D3413F' : '#BDBDBD',\n      radius: radio ? '50%' : '7px', op: disabled ? 0.45 : 1, cursor: disabled ? 'not-allowed' : 'pointer'\n    };\n  }\n  block(num, title, o, first) {\n    return Object.assign({ num, title, border: first ? 'none' : '1px solid #EAEAEA', hasChips: false, chips: [], wheel: false, hasRows: false, rows: [], hasSteppers: false, steppers: [], hasNote: false, note: '', hasAction: false, actionLabel: '', chipMin: '120px' }, o);\n  }\n  stepper(label, sub, qty, set, max, active) {\n    return { label, sub, qty, bd: qty > 0 ? '#D3413F' : '#E2E2E2', dec: () => set(Math.max(0, qty - 1)), inc: () => set(Math.min(max, qty + 1)) };\n  }\n\n  compute(s) {\n    const p = PR[s.veh], i = Math.min(s.size, p.komplet.length - 1), W = s.wheels;\n    const G = [], A = [], H = [], E = [];\n    const L = (arr, label, qty, unit, meta) => arr.push({ label, meta: meta || (qty + ' × ' + fmt(unit) + ' din'), total: fmt(qty * unit) + ' din', v: qty * unit });\n    const incl = { skid: s.pkg !== 'none', demont: s.pkg === 'komplet' || s.pkg === 'rft', balans: s.pkg === 'komplet' || s.pkg === 'rft' };\n    if (s.pkg === 'komplet') L(G, 'Komplet — montaža i balansiranje', W, p.komplet[i]);\n    if (s.pkg === 'rft' && p.rft && p.rft[i]) L(G, 'Komplet za RFT gume', W, p.rft[i]);\n    if (s.pkg === 'sezonska') L(G, 'Sezonska zamena kompletnog točka', W, p.sezonska[i]);\n    if (s.ex.skid && !incl.skid) L(G, 'Skidanje i nameštanje točka', W, p.skid[i]);\n    if (s.ex.demont && !incl.demont) L(G, 'Demontaža i montaža gume sa felne', W, p.demont[i]);\n    if (s.ex.balans && !incl.balans) L(G, 'Balansiranje točka', W, p.balans[i]);\n    if (s.ex.ventil) L(G, 'Tubeless ventil i ugradnja', W, VENTIL);\n    if (s.ex.senzor) L(G, 'Ugradnja senzora ventila', W, SENZOR);\n    if (s.krp > 0) L(G, p.krpLabel, s.krp, KRP);\n    if (s.tpms > 0) L(G, 'TPMS senzor sa kodiranjem', s.tpms, TPMS);\n    if (s.aDiag) L(A, 'Dijagnostika akumulatora', 1, 200, 'van garantnog roka');\n    if (s.aInst) L(A, 'Dijagnostika instalacije', 1, 300, 'anlaser, alternator');\n    if (s.charge === 'dopuna') L(A, 'Dopuna akumulatora', 1, DOPUNA[s.ah], AH[s.ah]);\n    if (s.charge === 'form') L(A, 'Formiranje akumulatora', 1, FORM[s.ah], AH[s.ah] + ' · napon ispod 10,50 V');\n    if (s.bat === '62') L(A, 'Exide AGM 12V 62Ah 680A D+', 1, 14990, '36 meseci garancije');\n    if (s.bat === '72') L(A, 'Exide AGM 12V 72Ah 760A D+', 1, 16490, '36 meseci garancije');\n    if (s.aMont) A.push({ label: 'Montaža i demontaža akumulatora', meta: 'zavisi od težine i složenosti', total: 'po proceni', v: 0 });\n    if (s.hotel === 'gume') L(H, 'Hotel za gume', 1, 3000, '4 kom · 6 meseci');\n    if (s.hotel === 'felne') L(H, 'Hotel za gume sa felnama', 1, 3600, '4 kom · 6 meseci');\n    if (s.hours > 0) L(E, 'Autoelektričarske usluge', s.hours, HOUR, s.hours + ' h × ' + fmt(HOUR) + ' din');\n    const vehLabel = VEH.find(v => v.id === s.veh).label + ' · ' + SIZES[s.veh][i] + ' · ' + W + ' ' + (W === 1 ? 'točak' : 'točka');\n    const groups = [];\n    if (G.length) groups.push({ title: 'Gume i točkovi', sub: vehLabel, lines: G });\n    if (A.length) groups.push({ title: 'Akumulator', sub: '', lines: A });\n    if (H.length) groups.push({ title: 'Hotel za gume', sub: 'po sezoni', lines: H });\n    if (E.length) groups.push({ title: 'Autoelektrika', sub: '', lines: E });\n    const total = [...G, ...A, ...H, ...E].reduce((a, l) => a + l.v, 0);\n    return { p, i, W, incl, groups, total, counts: { gume: G.length, aku: A.length, hotel: H.length, elektro: E.length }, estimate: s.aMont || s.hours > 0 };\n  }\n\n  gumeBlocks(s, c) {\n    const { p, i, W, incl } = c;\n    const sizes = SIZES[s.veh];\n    const unit = n => n ? fmt(n) + ' din / točak' : '';\n    const rftOk = !!(p.rft && p.rft[i]);\n    const pkgs = [\n      this.row({ label: 'Komplet — montaža i balansiranje', sub: 'Skidanje, demontaža, montaža, balansiranje i nameštanje', price: unit(p.komplet[i]), on: s.pkg === 'komplet', pick: () => this.pickPkg('komplet'), radio: true }),\n      this.row({ label: 'Komplet za RFT gume', sub: rftOk ? 'Run-flat gume' : 'Nije dostupno za ovu dimenziju / tip vozila', price: rftOk ? unit(p.rft[i]) : '—', on: s.pkg === 'rft', pick: () => this.pickPkg('rft'), disabled: !rftOk, radio: true }),\n      this.row({ label: 'Sezonska zamena kompletnog točka', sub: 'Gume su već na felnama — menjamo cele točkove', price: unit(p.sezonska[i]), on: s.pkg === 'sezonska', pick: () => this.pickPkg('sezonska'), radio: true }),\n      this.row({ label: 'Bez paketa', sub: 'Biram pojedinačne usluge', price: '', on: s.pkg === 'none', pick: () => this.pickPkg('none'), radio: true })\n    ];\n    const exRow = (k, label, price, sub) => this.row({ label, sub, price: fmt(price) + ' din', on: incl[k] ? false : !!s.ex[k], pick: () => this.toggleEx(k), disabled: !!incl[k], tag: incl[k] ? 'U paketu' : '' });\n    const extras = [\n      exRow('skid', 'Skidanje i nameštanje točka sa vozila', p.skid[i]),\n      exRow('demont', 'Demontaža i montaža gume sa felne', p.demont[i]),\n      exRow('balans', 'Balansiranje točka', p.balans[i]),\n      this.row({ label: 'Tubeless ventil i ugradnja', sub: 'Preporučujemo pri svakoj zameni guma', price: fmt(VENTIL) + ' din', on: !!s.ex.ventil, pick: () => this.toggleEx('ventil') }),\n      this.row({ label: 'Ugradnja senzora ventila', price: fmt(SENZOR) + ' din', on: !!s.ex.senzor, pick: () => this.toggleEx('senzor') })\n    ];\n    const setTpms = n => this.setState(st => ({ tpms: n, pkg: n > 0 && st.pkg !== 'komplet' && st.pkg !== 'rft' ? 'komplet' : st.pkg }));\n    return [\n      this.block('01', 'Tip vozila', { hasChips: true, chipMin: '132px', chips: VEH.map(v => ({ ...this.chip(s.veh === v.id), label: v.label, sub: v.sub, hasSub: true, on: s.veh === v.id, pick: () => this.pickVeh(v.id) })) }, true),\n      this.block('02', 'Dimenzija felne', { hasChips: true, chipMin: '124px', wheel: true, wheelPct: Math.round(48 + (INCH[s.veh][i] - 12) / 12.5 * 52) + '%', sizeLabel: sizes[i], chips: sizes.map((z, k) => ({ ...this.chip(k === i), label: z, sub: '', hasSub: false, on: k === i, pick: () => this.pickSize(k) })) }),\n      this.block('03', 'Broj točkova', { hasChips: true, chipMin: '64px', chips: [1, 2, 3, 4].map(n => ({ ...this.chip(W === n), label: String(n), sub: '', hasSub: false, on: W === n, pick: () => this.setState({ wheels: n }) })) }),\n      this.block('04', 'Osnovna usluga', { hasRows: true, rows: pkgs, hasNote: s.tpms > 0, note: 'Ugradnja TPMS senzora zahteva skidanje točka, demontažu i montažu, balansiranje i nameštanje — naplaćuje se po cenovniku za komplet.' }),\n      this.block('05', 'Dodatne usluge', { hasRows: true, rows: extras }),\n      this.block('06', 'Po komadu', { hasSteppers: true, steppers: [\n        this.stepper(p.krpLabel, fmt(KRP) + ' din / guma', s.krp, n => this.setState({ krp: n }), 4),\n        this.stepper('TPMS senzor sa kodiranjem', fmt(TPMS) + ' din / senzor · uz ugradnju po kompletu', s.tpms, setTpms, 4)\n      ] })\n    ];\n  }\n  akuBlocks(s) {\n    return [\n      this.block('01', 'Dijagnostika', { hasRows: true, rows: [\n        this.row({ label: 'Dijagnostika akumulatora', sub: 'Van garantnog roka', price: '200 din', on: s.aDiag, pick: () => this.setState(x => ({ aDiag: !x.aDiag })) }),\n        this.row({ label: 'Dijagnostika instalacije na vozilu', sub: 'Anlaser, alternator', price: '300 din', on: s.aInst, pick: () => this.setState(x => ({ aInst: !x.aInst })) })\n      ] }, true),\n      this.block('02', 'Kapacitet akumulatora', { hasChips: true, chipMin: '140px', chips: AH.map((a, k) => ({ ...this.chip(s.ah === k), label: a, sub: '', hasSub: false, on: s.ah === k, pick: () => this.setState({ ah: k }) })) }),\n      this.block('03', 'Punjenje', { hasRows: true, rows: [\n        this.row({ label: 'Bez punjenja', on: s.charge === 'none', pick: () => this.setState({ charge: 'none' }), radio: true }),\n        this.row({ label: 'Dopuna akumulatora', sub: AH[s.ah], price: fmt(DOPUNA[s.ah]) + ' din', on: s.charge === 'dopuna', pick: () => this.setState({ charge: 'dopuna' }), radio: true }),\n        this.row({ label: 'Formiranje akumulatora', sub: 'Kada je napon ispod 10,50 V · ' + AH[s.ah], price: fmt(FORM[s.ah]) + ' din', on: s.charge === 'form', pick: () => this.setState({ charge: 'form' }), radio: true })\n      ] }),\n      this.block('04', 'Novi akumulator', { hasRows: true, hasNote: true, note: 'Cenu i raspoloživost potvrdite telefonom pre dolaska. Po dogovoru poručujemo i model koji nemamo na stanju.', rows: [\n        this.row({ label: 'Ne treba mi novi', on: s.bat === 'none', pick: () => this.setState({ bat: 'none' }), radio: true }),\n        this.row({ label: 'Exide AGM 12V 62Ah 680A D+', sub: '36 meseci garancije', price: '14.990 din', on: s.bat === '62', pick: () => this.setState({ bat: '62' }), radio: true }),\n        this.row({ label: 'Exide AGM 12V 72Ah 760A D+', sub: '36 meseci garancije', price: '16.490 din', on: s.bat === '72', pick: () => this.setState({ bat: '72' }), radio: true })\n      ] }),\n      this.block('05', 'Ugradnja', { hasRows: true, rows: [\n        this.row({ label: 'Montaža i demontaža akumulatora', sub: 'Naplaćuje se u zavisnosti od težine akumulatora i složenosti postupka', price: 'po proceni', on: s.aMont, pick: () => this.setState(x => ({ aMont: !x.aMont })) })\n      ] })\n    ];\n  }\n  hotelBlocks(s) {\n    const sugg = s.hotel !== 'none' && s.pkg === 'none';\n    return [\n      this.block('01', 'Čuvanje guma — 4 kom, 6 meseci', { hasRows: true, rows: [\n        this.row({ label: 'Bez hotela', on: s.hotel === 'none', pick: () => this.setState({ hotel:
